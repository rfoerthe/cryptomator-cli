name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    strategy:
      # A red macOS run must not hide a Linux one, and vice versa: this matrix exists precisely to
      # find the architecture-specific failures a two-runner matrix could not.
      fail-fast: false
      matrix:
        # Both Linux architectures and arm64 macOS: ubuntu-22.04 is x86_64, ubuntu-22.04-arm is
        # arm64, macos-15 is arm64. There is no x86_64 macOS row any more -- `macos-13` was the
        # last such image and it has been retired. The release still ships an
        # `x86_64-apple-darwin` binary, cross-compiled on `macos-15` (`release.yml`); what is gone
        # is running the test suite on that architecture, which the CHANGELOG records as a known
        # limitation.
        os: [ubuntu-22.04, ubuntu-22.04-arm, macos-15]
    runs-on: ${{ matrix.os }}
    env:
      # The daemon tests (crates/crypto/tests/cli_daemon.rs) mount through the null mounter, which
      # only exists when this is set. They set it per command in `Sandbox::crypto`, so this is a
      # no-op today; it is here so that a test added without that helper still finds the mounter.
      CRYPTO_ENABLE_NULL_MOUNTER: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # `cargo fmt` and `cargo clippy` produce the same answer on every runner; running them three
      # times costs a minute each and buys nothing. They stay on the matrix all the same, because
      # splitting them into a fourth job would mean a fourth checkout and a fourth cold cache.
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # This covers the M7 command tests too -- `cli_health.rs`, `cli_migrate.rs` and
      # `cli_recovery.rs` need neither Java nor a mount, only the committed fixtures, so they run
      # here rather than in a job of their own.
      - run: cargo test --workspace --locked

  # The Java side of the interop: cryptofs 2.10.0 opens what `crypto` wrote. Since M7 that also
  # covers the migrated legacy vaults (`java_reads_vaults_migrated_from_legacy_formats`, formats
  # 7/6/5 -> 8) and a vault whose key files `recovery-key restore` rebuilt.
  interop-java:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # The tests shell out to `mvn ... exec:exec` per vault. Compiling the harness once up front
      # downloads cryptofs 2.10.0 into the (cached) `~/.m2` and turns a network failure into a
      # named step instead of a test that times out. `-B` keeps the download progress bars out of
      # the log. The *legacy* cryptofs releases are not needed: the fixtures are committed, and
      # only regenerating them (tools/fixture-gen/legacy-v*) reaches for 1.9.15/1.8.9/1.3.2.
      - name: prime the fixture-gen harness (downloads cryptofs 2.10.0)
        run: mvn -q -B -f tools/fixture-gen/pom.xml compile
      - run: cargo test -p crypto --test java_interop --locked -- --ignored

  # The end-to-end tests that mount a real file system. They are `#[ignore]`d twice over: `cargo
  # test` skips them, and even `--ignored` only mounts when `CRYPTO_E2E_MOUNT=1` says the machine
  # may be mounted on. Without a working back end they print "skipped" and pass, so a green job is
  # only meaningful together with the "service:" line in its log.
  mount-e2e-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # `fusermount3` is what the Linux provider probes for and what fuser calls to mount.
      - run: sudo apt-get update && sudo apt-get install -y fuse3
      - run: CRYPTO_E2E_MOUNT=1 cargo test -p cryptomator-mount --test mount_e2e --locked -- --ignored
      # The same proof one level up: `crypto unlock` must not answer before the volume is visible.
      - run: CRYPTO_E2E_MOUNT=1 cargo test -p crypto --test cli_daemon --locked -- --ignored

  # macOS has no FUSE back end out of the box. FUSE-T is installed from its cask; it needs no kext
  # and no system-extension approval, but the cask ships a system daemon whose installation can
  # still fail or need a prompt on a hosted runner. So this job may not mount, and a red mount is
  # not a red build: `continue-on-error` keeps it advisory until the runner image is known good.
  mount-e2e-macos:
    runs-on: macos-15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: brew install --cask macos-fuse-t/homebrew-cask/fuse-t
      - run: CRYPTO_E2E_MOUNT=1 cargo test -p cryptomator-mount --test mount_e2e --locked -- --ignored
      # The same proof one level up, and the one that matters most on FUSE-T: `crypto unlock` must
      # not answer before the volume is visible.
      - run: CRYPTO_E2E_MOUNT=1 cargo test -p crypto --test cli_daemon --locked -- --ignored

  # The WebDAV end-to-end tests that mount a real volume. `webdav-applescript` asks Finder, through
  # `osascript -e 'mount volume …'`, so it needs a GUI (window server) session that a hosted runner
  # may not have -- and macOS may put a "connect to an unencrypted server?" dialog in the way, since
  # there is no keychain item to suppress it (Java writes an anonymous *internet* password for the
  # server; M6 brought the vault keychain, that item is M8). Both tests print "skipped: …" and
  # pass when the mounter is not supported here, so a green job is only meaningful together with the
  # "mounted at …" line in its log; `continue-on-error` keeps it advisory either way. The
  # HTTP-level tests (crates/cryptomator-mount/tests/webdav_http.rs) need none of this and run in
  # the ordinary `test` job above.
  webdav-e2e-macos:
    runs-on: macos-15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: CRYPTO_E2E_WEBDAV=1 cargo test -p cryptomator-mount --test webdav_e2e --locked -- --ignored --nocapture
      # The same proof one level up, through the CLI: `crypto unlock --mounter webdav-applescript`
      # must answer with a /Volumes path that a write really travels through into the vault.
      - run: CRYPTO_E2E_WEBDAV=1 cargo test -p crypto --test cli_daemon --locked -- --ignored --nocapture

  # Linux runners have no gvfs session, so `gio mount` cannot work here and `webdav-gio` has no
  # end-to-end job. What is checked instead is the server itself, over HTTP, exactly as a
  # `gio`/Nautilus/Finder client would talk to it -- and one level up, through `crypto unlock`.
  webdav-e2e-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked -p crypto
      - name: serve a vault over WebDAV and talk to it with curl
        run: |
          # Deliberately no `set -x`: a trace would put the vault password into a public log.
          set -euo pipefail
          CRYPTO="$PWD/target/debug/crypto"
          export HOME="$RUNNER_TEMP/home"
          export CRYPTO_SETTINGS_PATH="$RUNNER_TEMP/settings.json"
          export CRYPTO_STATE_DIR="$RUNNER_TEMP/state"
          mkdir -p "$HOME" "$CRYPTO_STATE_DIR"
          PW="$RUNNER_TEMP/pw"
          (umask 077; printf 'ci-password-123' > "$PW")
          trap '"$CRYPTO" lock --all >/dev/null 2>&1 || true; rm -f "$PW"' EXIT
          "$CRYPTO" vault create "$RUNNER_TEMP/v" --password-file "$PW"
          # `--port 0`: any free port, so the job never fights anything else on 42427.
          URL=$("$CRYPTO" --json unlock v --mounter webdav --port 0 --password-file "$PW" \
                | python3 -c 'import json,sys; print(json.load(sys.stdin)["mountpoint"])')
          echo "serving at $URL"
          curl -sf -X PROPFIND -H 'Depth: 1' "$URL/" -o /dev/null
          printf 'hello\n' > "$RUNNER_TEMP/ci.txt"
          curl -sf -T "$RUNNER_TEMP/ci.txt" "$URL/ci.txt"
          test "$(curl -sf "$URL/ci.txt")" = hello
          curl -sf -X MKCOL "$URL/dir" -o /dev/null
          curl -sf -X DELETE "$URL/dir" -o /dev/null
          "$CRYPTO" lock v
          # The bytes went through the server into the vault, not past it.
          "$CRYPTO" fs cat v /ci.txt --password-file "$PW" | grep -qx hello

  # The keychain end-to-end tests. Like the mount jobs they are `#[ignore]`d twice over: `cargo
  # test` skips them, and even `--ignored` only touches a keyring when CRYPTO_E2E_KEYCHAIN=1 says
  # so. Everything else about the keychain -- every CLI flow -- runs against the file-backed fake
  # in the ordinary `test` job above.
  #
  # `continue-on-error`: gnome-keyring under a headless session is fragile (no display, no
  # ssh-agent, an empty-password keyring created on the fly), so a red job here must not block a
  # pull request. A green one is only meaningful together with the "round trip: ok" line and the
  # attribute assertions in its log -- both tests print "skipped: ..." and pass when no secret
  # service answered. This is also the *first* place the Linux backend runs at all: it was written
  # on a Mac and has no other hardware to run on.
  keychain-e2e-linux:
    runs-on: ubuntu-22.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # `libsecret-tools` is what provides `secret-tool`; `dbus-x11` provides `dbus-run-session`.
      - run: sudo apt-get update && sudo apt-get install -y gnome-keyring libsecret-tools dbus-x11
      - run: cargo build --locked -p crypto
      # The script is written to a file rather than inlined into `bash -c '...'`: it contains both
      # quote characters, and one wrong nesting level would silently change what is asserted.
      - name: write the keychain script
        run: |
          # Deliberately no `set -x` anywhere below: a trace would put the vault password into a
          # public log. `secret-tool search` prints the secret itself, so its output is filtered
          # down to the label and the attributes before anything is echoed.
          cat > "$RUNNER_TEMP/keychain-e2e.sh" <<'SCRIPT'
          set -euo pipefail

          echo "::group::the end-to-end test against gnome-keyring"
          CRYPTO_E2E_KEYCHAIN=1 cargo test -p cryptomator-app --test keychain_e2e --locked \
            -- --ignored --nocapture
          echo "::endgroup::"

          CRYPTO="$PWD/target/debug/crypto"
          export CRYPTO_SETTINGS_PATH="$RUNNER_TEMP/kc-settings.json"
          export CRYPTO_STATE_DIR="$RUNNER_TEMP/kc-state"
          mkdir -p "$CRYPTO_STATE_DIR"
          PW="$RUNNER_TEMP/kc-pw"
          (umask 077; printf 'ci-password-123' > "$PW")
          trap 'rm -f "$PW"' EXIT

          "$CRYPTO" vault create "$RUNNER_TEMP/kcv" --name kcv --password-file "$PW"
          ID=$("$CRYPTO" --json vault list \
               | python3 -c 'import json,sys; print(json.load(sys.stdin)[0]["id"])')
          echo "vault id: $ID"

          # `secret-tool search` prints `secret = ...` too, so only the label and the attributes
          # ever reach the log. These are the raw names the desktop app has to agree with.
          attributes() {
            secret-tool search Vault "$ID" 2>/dev/null | grep -E '^(label|attribute\.)' || true
          }

          # The default provider on Linux is GnomeKeyringKeychainAccess: `Vault`, no `Name`.
          "$CRYPTO" config get keychainProvider
          "$CRYPTO" password store kcv --password-file "$PW"
          GK=$(attributes)
          echo "gnome-keyring item:"; echo "$GK"
          echo "$GK" | grep -qxF "label = Cryptomator"
          echo "$GK" | grep -qxF "attribute.Vault = $ID"
          if echo "$GK" | grep -q '^attribute\.Name'; then
            echo "GnomeKeyringKeychainAccess must not write a Name attribute"; exit 1
          fi
          "$CRYPTO" password forget kcv
          test -z "$(attributes)"

          # The SecretService variant writes `Name` as well, and is found by `Vault` alone.
          "$CRYPTO" config set keychainProvider secret-service
          "$CRYPTO" password store kcv --password-file "$PW"
          SS=$(attributes)
          echo "secret-service item:"; echo "$SS"
          echo "$SS" | grep -qxF "label = Cryptomator"
          echo "$SS" | grep -qxF "attribute.Vault = $ID"
          echo "$SS" | grep -qxF "attribute.Name = kcv"
          # A stored password is a password source of its own: nothing else is passed here.
          "$CRYPTO" fs ls kcv / >/dev/null
          "$CRYPTO" password forget kcv
          test -z "$(attributes)"
          echo "keychain CLI smoke: ok"
          SCRIPT
          chmod +x "$RUNNER_TEMP/keychain-e2e.sh"
      - name: round-trip a passphrase through gnome-keyring
        # `dbus-run-session` gives the daemon a private session bus; `--unlock` with an empty
        # password on stdin creates and unlocks the default keyring, so nothing prompts. The
        # daemon prints the environment it wants exported, hence the `eval`.
        run: |
          set -euo pipefail
          dbus-run-session -- bash -c '
            eval "$(echo -n "" | gnome-keyring-daemon --unlock --components=secrets)"
            export GNOME_KEYRING_CONTROL
            bash "$RUNNER_TEMP/keychain-e2e.sh"
          '

  # macOS runners have an unlocked login keychain, so no `security create-keychain` is needed. The
  # test points $CRYPTO_KEYCHAIN_SERVICE at `crypto-e2e-<pid>`, so it can only ever see its own
  # items and never the real "Cryptomator" ones, and it deletes everything it wrote through a
  # guard that also runs on panic.
  #
  # The one thing this job cannot cover is the ACL prompt: nothing on a hosted runner can put a
  # dialog on screen, and the phase that reads a foreign entry seeds it with
  # `security add-generic-password -A` ("any application may read it") precisely to avoid one.
  # Reading an entry the Cryptomator desktop app wrote needs a human at a real Mac to answer
  # "Always Allow" -- see the keychain section of the README. Every call is under a 10-second
  # timeout that turns a dialog into a "skipped:" line rather than a hang, so `continue-on-error`
  # keeps the job advisory and a green job is only meaningful together with the "round trip: ok"
  # line in its log.
  keychain-e2e-macos:
    runs-on: macos-15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: CRYPTO_E2E_KEYCHAIN=1 cargo test -p cryptomator-app --test keychain_e2e --locked -- --ignored --nocapture

  # Advisories, licences, banned crates and registries in one pass over `deny.toml`. Deliberately
  # not a second `cargo audit` job: both read the same RustSec database, and two configurations for
  # one statement is one too many (M8 ruling 6).
  #
  # `command: check` with no argument runs *every* check cargo-deny has. Naming today's four would
  # freeze the list and silently skip whatever it grows next.
  supply-chain:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  # The floor the workspace promises (`rust-version` in Cargo.toml). `cargo check` rather than
  # `cargo test`: what has to hold on 1.89 is that the code compiles, not that it passes -- the
  # `test` job above already ran the suite on stable. `--all-targets` puts the test and example
  # targets, and with them the dev-dependencies, on the hook as well; if that is ever what turns
  # this job red, the answer is to raise `rust-version`, not to drop the flag.
  #
  # The repository's `rust-toolchain.toml` pins `channel = "stable"` and would otherwise win over
  # whatever is installed here. `dtolnay/rust-toolchain` exports `RUSTUP_TOOLCHAIN`, which beats
  # the file -- that is the only reason this job checks anything at all. `@1.89` is the action's
  # branch for that release; a test asserts it still equals the workspace's `rust-version`, so
  # raising the MSRV without touching this job turns red rather than quiet.
  msrv:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv
      - run: cargo check --workspace --all-targets --locked
