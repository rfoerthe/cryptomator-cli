[workspace]
resolver = "2"
members = [
    "crates/cryptomator-core",
    "crates/cryptomator-app",
    "crates/cryptomator-mount",
    "crates/crypto",
    # Development-time tooling (manpages, shell completions). Not published.
    "xtask",
    # Vendored fork; see vendor/fuser/README-VENDORED.md.
    "vendor/fuser",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
repository = "https://github.com/rfoerthe/cryptomator-cli"
# 1.89 because `aes 0.9.3` (and `libloading 0.9`, 1.88) need it; the workspace's own code is
# 1.85-clean, but the lock file is what has to build.
rust-version = "1.89"

[workspace.dependencies]
aes-siv = "0.8"
aes-gcm = "0.11"
aes = "0.9"
ctr = "0.10"
hmac = "0.13"
sha1 = "0.11"
sha2 = "0.11"
scrypt = "0.12"
aes-kw = "0.3"
data-encoding = "2.11"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
uuid = { version = "1", features = ["v4"] }
zeroize = { version = "1.9", features = ["derive"] }
getrandom = "0.4"
crc32fast = "1.5"
thiserror = "2"
anyhow = "1"
# `string` lets a `Command` be built from owned strings, which is what
# `crypto::commands::completions::public_command` needs to copy the grammar's name and version
# into the rebuilt command instead of repeating them as literals.
clap = { version = "4.6", features = ["derive", "env", "wrap_help", "string"] }
clap_complete = "4.6"
clap_mangen = "0.2"
# Only `xtask`'s tests use it: they read `[package.metadata.deb]` back the way cargo-deb does,
# instead of grepping the manifest text.
toml_edit = { version = "0.25", default-features = false, features = ["parse"] }
fuser = { version = "0.18", default-features = false, features = ["macos-no-mount"] }
libloading = "0.9"
tempfile = "3"
assert_cmd = "2"
predicates = "3"
rpassword = "7.5"
unicode-normalization = "0.1"
regex = "1"
proptest = "1"
nix = { version = "0.31", features = ["process", "signal", "user", "fs", "feature"] }
libc = "0.2"
signal-hook = "0.3"
log = "0.4"

# The WebDAV back end (feature `webdav` of cryptomator-mount): dav-server over a hyper 1.x
# loopback server, driven by a small current-thread-capable tokio runtime.
dav-server = { version = "0.11.0", default-features = false }
hyper = { version = "1.11.1", default-features = false, features = ["server", "http1"] }
hyper-util = { version = "0.1.20", default-features = false, features = [
    "tokio",
    "server-graceful",
    # `http1` is what carries hyper-util's `GracefulConnection` impl for an HTTP/1 connection.
    "http1",
] }
http-body-util = "0.1.5"
tokio = { version = "1.53.1", default-features = false, features = [
    "rt",
    "rt-multi-thread",
    "net",
    "io-util",
    "time",
    "sync",
    # `macros` is for `tokio::select!` in the server's accept loop.
    "macros",
] }
bytes = "1.12"
futures-util = { version = "0.3.34", default-features = false, features = ["alloc"] }

# Keychain back ends. `security-framework` wraps Security.framework (macOS); only the generic
# password API is used, so the default TLS features (`alpn`, `session-tickets`) stay off.
security-framework = { version = "3.7.0", default-features = false }
# `secret-service` speaks the FreeDesktop Secret Service D-Bus interface (Linux only). The
# blocking API is what we use, so the runtime only ever matters for zbus's own `block_on`:
# `rt-tokio` reuses the tokio the workspace already depends on instead of pulling async-io in
# next to it, and `crypto-rust` is the pure-Rust DH session (no OpenSSL to link against).
secret-service = { version = "5.2", default-features = false, features = [
    "rt-tokio-crypto-rust",
] }

# fuser is vendored under vendor/fuser: FUSE-T on macOS speaks the Linux struct layouts while
# upstream fuser hard-codes the macFUSE ones. See vendor/fuser/README-VENDORED.md.
[patch.crates-io]
fuser = { path = "vendor/fuser" }

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "unwind"

# scrypt, AES and SHA dominate the test suite; unoptimised they make `cargo test` several times
# slower. Workspace crates stay at opt-level 0 so debugging and incremental builds are unaffected.
[profile.dev.package."*"]
opt-level = 2
