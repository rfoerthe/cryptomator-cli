[package]
name = "cryptomator-app"
description = "Settings, keychain, daemon and vault registry for the crypto CLI"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
cryptomator-core = { path = "../cryptomator-core" }
# The features are named explicitly: a `--no-default-features` build of the mount crate must not
# silently take the WebDAV back ends (and with them `crypto unlock --mounter webdav`) away here.
cryptomator-mount = { path = "../cryptomator-mount", features = ["fuse", "webdav"] }
clap.workspace = true
data-encoding.workspace = true
# `std` for `log::set_boxed_logger`, which the daemon installs (see `daemon::logging`).
log = { workspace = true, features = ["std"] }
# `fs` for `fcntl::Flock`, the lock around every `settings.json` write.
nix = { workspace = true, features = ["process", "signal", "user", "fs"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
zeroize.workspace = true
rpassword.workspace = true
unicode-normalization.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
security-framework.workspace = true

# The Secret Service back ends (`keychain::linux`). Linux only: on macOS the crate would only pull
# zbus and a D-Bus session bus that is not there.
[target.'cfg(target_os = "linux")'.dependencies]
secret-service.workspace = true

[dev-dependencies]
tempfile.workspace = true

# The keychain E2E seeds an item under the *legacy* service name, which carries a NUL byte: only
# `SecKeychainAddGenericPassword`, which takes a length-delimited byte range, can express it.
[target.'cfg(target_os = "macos")'.dev-dependencies]
security-framework.workspace = true
